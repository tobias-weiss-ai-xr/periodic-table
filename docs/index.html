<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>The Periodic Table Room · 3D + WebXR</title>
  <meta name="description" content="Walk a 3D gallery of all 118 elements — a room-sized periodic table with per-element atom models, live search, and a WebXR option." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%2305060a' stroke='%233fe0ff' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%233fe0ff' stroke-width='1.6' transform='rotate(-24 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5.5' fill='none' stroke='%23ffcf5c' stroke-width='1.6' transform='rotate(34 16 16)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="assets/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="room"></canvas>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Building the periodic table room…</div>
  </div>

  <header id="hud">
    <h1>The Periodic Table Room</h1>
    <p class="sub" id="sub">118 elements · one walkable gallery</p>
  </header>

  <div id="search">
    <input id="search-input" type="search"
           placeholder="Search element, symbol or number…"
           autocomplete="off" spellcheck="false" aria-label="Search elements" />
  </div>

  <div id="legend" aria-label="Element families"></div>

  <aside id="panel" class="hidden">
    <button id="panel-close" title="Close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <button id="xr" class="hidden" type="button">Enter XR</button>

  <footer id="hint">
    <span>click to look around</span> · <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</span> ·
    <span><kbd>Shift</kbd> sprint</span> · <span>click an atom to explore</span> · <span><kbd>Esc</kbd> release</span>
  </footer>
  <div id="xr-hint" class="hidden">In VR: move with the left stick, point &amp; select with the right trigger.</div>

  <div id="fps"></div>

  <!-- element data (classic script, exposes window.ELEMENTS) -->
  <script src="assets/elements-data.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
